name: Test Flutter Fastlane Action
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-scripts:
    name: Test Script Logic (Mocked)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mock binaries
        run: |
          mkdir -p $HOME/bin
          echo '#!/bin/bash' > $HOME/bin/flutter
          echo 'echo "Mock Flutter $@" && exit 0' >> $HOME/bin/flutter
          echo '#!/bin/bash' > $HOME/bin/shorebird
          echo 'echo "Mock Shorebird $@" && exit 0' >> $HOME/bin/shorebird
          chmod +x $HOME/bin/*
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Verify script permissions
        run: |
          chmod +x scripts/*.sh
          for script in scripts/*.sh; do
            test -x "$script" && echo "✅ $(basename "$script") is executable" || echo "❌ Error: $(basename "$script") is not executable"
          done

      - name: Validate input validation script
        run: |
          # Test with empty platform (should fail)
          export platform=""
          ! scripts/validate_inputs.sh || (echo "❌ Should have failed with empty platform" && exit 1)

          # Test with valid platform and required vars
          export platform="android"
          export packageName="com.example.test"
          export hasServiceAccount="true"
          export androidKeyStorePath="android/app/keystore.jks"
          export androidKeyStorePassword="testpass"
          export androidKeyStoreAlias="testkey"
          export androidKeyPassword="testpass"
          scripts/validate_inputs.sh && echo "✅ Passed with valid platform"

      - name: Test environment setup script
        run: |
          # Create a mock pubspec.yaml
          echo "version: 1.0.0+1" > pubspec.yaml
          
          # Mock GITHUB_ENV if not set
          export GITHUB_ENV=${GITHUB_ENV:-mock_env}
          touch "$GITHUB_ENV"
          
          scripts/setup_env_vars.sh \
            --platform "android" \
            --flutter-version "3.27.4" \
            --flutter-channel "stable" \
            --working-directory "." \
            --build-name "1.0.0" \
            --build-number "1" \
            --is-patch "false" \
            --use-shorebird "false" \
            --package-name "com.example.test"

          # Verify env vars were set
          grep -q "buildName=1.0.0" "$GITHUB_ENV" && echo "✅ Environment variables set correctly"

  test-android-logic:
    name: Test Android Script Logic
    runs-on: ubuntu-latest
    needs: test-scripts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mock tools
        run: |
          mkdir -p $HOME/bin
          echo '#!/bin/bash' > $HOME/bin/flutter
          echo 'echo "Mock Flutter $@" && exit 0' >> $HOME/bin/flutter
          echo '#!/bin/bash' > $HOME/bin/shorebird
          echo 'echo "Mock Shorebird $@" && exit 0' >> $HOME/bin/shorebird
          chmod +x $HOME/bin/*
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup project skeleton
        run: |
          mkdir -p test_project/android/app
          touch test_project/pubspec.yaml
          echo "version: 1.0.0+1" > test_project/pubspec.yaml
          
          # Create dummy keystore file
          touch test_project/android/app/keystore.jks

      - name: Test android_build.sh execution
        env:
          workingDir: "test_project"
          buildName: "1.0.0"
          buildNumber: "1"
          isShorebird: "false"
          isPatch: "false"
          flutterV: "3.27.4"
          packageName: "com.example.test_project"
          androidKeyStorePath: "android/app/keystore.jks"
          androidKeyStorePassword: "testpass"
          androidKeyStoreAlias: "testkey"
          androidKeyPassword: "testpass"
          skipConfigureKeystore: "false"
          GITHUB_ENV: "mock_env"
        run: |
          cd $workingDir
          # Set releaseV
          export releaseV="1.0.0"
          chmod +x ../scripts/*.sh
          ../scripts/android_build.sh && echo "✅ Android build script logic passed"

  test-ios-logic:
    name: Test iOS Script Logic
    runs-on: ubuntu-latest
    needs: test-scripts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mock tools
        run: |
          mkdir -p $HOME/bin
          echo '#!/bin/bash' > $HOME/bin/git
          echo 'echo "Mock Git $@" && exit 0' >> $HOME/bin/git
          echo '#!/bin/bash' > $HOME/bin/ssh
          echo 'echo "Mock SSH $@" && exit 0' >> $HOME/bin/ssh
          echo '#!/bin/bash' > $HOME/bin/ssh-keyscan
          echo 'echo "Mock ssh-keyscan $@" && exit 0' >> $HOME/bin/ssh-keyscan
          echo '#!/bin/bash' > $HOME/bin/bundle
          echo 'echo "Mock bundle $@" && exit 0' >> $HOME/bin/bundle
          chmod +x $HOME/bin/*
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup project skeleton
        run: |
          mkdir -p ios/fastlane
          touch pubspec.yaml

      - name: Test get_fastlane_configs.sh execution
        env:
          GITHUB_ACTION_PATH: ${{ github.workspace }}
          MATCH_SIGNING_GIT_URL: "git@github.com:example/match-repo.git"
          MATCH_GIT_BRANCH: "certificates"
        run: |
          chmod +x scripts/*.sh
          # Mock the matching branch check by making git output something
          scripts/get_fastlane_configs.sh '{"MATCH_GIT_SSH_KEY":"dummy-key"}' && echo "✅ iOS config script logic passed"

# We can't do a full iOS test without proper certificates and profiles
# but we can test the script execution


